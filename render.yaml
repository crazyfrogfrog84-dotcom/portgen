databases:
  - name: portgen-m1uh-db
    databaseName: portgen
    user: portgen
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: portgen-m1uh
    runtime: docker
    plan: free
    region: singapore
    branch: codex/render-deployment
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: portgen-m1uh
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_TIMEZONE
        value: Asia/Taipei
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: portgen-m1uh-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: 'true'
