name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portgen_test
          POSTGRES_PASSWORD: portgen_test_password
          POSTGRES_DB: portgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portgen_test -d portgen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_pgsql, pgsql, sqlite3, xml, zip
          coverage: none
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check secrets and environment files
        run: php scripts/check-secrets.php --worktree
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run Pint
        run: ./vendor/bin/pint --test
      - name: Verify PostgreSQL migrations and rollback
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: portgen_test
          DB_USERNAME: portgen_test
          DB_PASSWORD: portgen_test_password
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
      - name: Run PHP tests on PostgreSQL
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: portgen_test
          DB_USERNAME: portgen_test
          DB_PASSWORD: portgen_test_password
        run: php artisan test
      - name: Install Node dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
