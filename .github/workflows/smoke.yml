name: Live smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'codex/render-deployment']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.PORTGEN_LIVE_URL != ''
    runs-on: ubuntu-latest
    env:
      PORTGEN_LIVE_URL: ${{ vars.PORTGEN_LIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Retry health and page checks
        shell: bash
        run: |
          base="${PORTGEN_LIVE_URL%/}"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$base/up" --output /tmp/portgen-health.txt
          grep -q '^OK' /tmp/portgen-health.txt
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base/portfolios/create" --output /tmp/portgen-create.html && grep -q 'data-portfolio-form novalidate' /tmp/portgen-create.html; then
              break
            fi
            sleep 10
          done
          grep -q 'data-portfolio-form novalidate' /tmp/portgen-create.html
          grep -q 'Create your portfolio' /tmp/portgen-create.html
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$base/p/portgen001" --output /tmp/portgen-demo.html
          grep -q 'Jordan Sample' /tmp/portgen-demo.html
      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create and render a throwaway portfolio on the live site
        env:
          PORTGEN_BASE_URL: ${{ vars.PORTGEN_LIVE_URL }}
          PORTGEN_LIVE_SMOKE: '1'
        run: npx playwright test --config=playwright.live-smoke.config.js
